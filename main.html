<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neature OS - Android 8</title>
  <!-- Google Roboto Font for real Android feel -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      -webkit-user-select: none;
      font-family: 'Roboto', sans-serif; 
      touch-action: manipulation;
    }
    
    body {
      /* Android 8 Oreo Wallpaper */
      background: linear-gradient(135deg, #1a237e 0%, #311b92 50%, #880e4f 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Android Status Bar */
    #status-bar {
      height: 28px;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      font-size: 12px;
      font-weight: 500;
      z-index: 10000;
    }

    /* Desktop App Grid */
    #desktop {
      flex-grow: 1;
      position: relative;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
      grid-auto-rows: 90px;
      gap: 15px;
      overflow: hidden;
    }

    /* App Icons */
    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      font-size: 12px;
    }

    .app-icon-bg {
      width: 54px;
      height: 54px;
      background: #ffffff;
      border-radius: 50%; /* Android 8 adaptive icon style */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      margin-bottom: 6px;
    }

    .app-icon:active .app-icon-bg {
      transform: scale(0.9);
      opacity: 0.8;
    }

    /* Mobile Responsive Android Window Card */
    .android-window {
      position: absolute;
      width: calc(100vw - 32px);
      max-width: 420px;
      height: 60vh;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      left: 16px;
      top: 40px;
      z-index: 100;
    }

    /* Android Header Bar */
    .android-header {
      height: 52px;
      background: #3f51b5;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-weight: 500;
      font-size: 16px;
      touch-action: none; /* Prevents scroll while dragging header */
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 20px;
      padding: 8px;
      cursor: pointer;
    }

    .android-window-body {
      flex-grow: 1;
      padding: 16px;
      overflow-y: auto;
      color: #212121;
      -webkit-overflow-scrolling: touch;
    }

    /* Android Navigation Bar (Bottom) */
    #nav-bar {
      height: 48px;
      background: #000000;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10000;
    }

    .nav-btn {
      color: #fff;
      font-size: 20px;
      padding: 10px 25px;
      cursor: pointer;
      opacity: 0.85;
    }

    .nav-btn:active {
      opacity: 0.4;
    }
  </style>
  <script src="build/libv86.js"></script>
</head>
<body>

  <!-- Android 8 Status Bar -->
  <div id="status-bar">
    <span id="clock">12:00</span>
    <div>
      <span>📶</span>
      <span style="margin-left: 6px;">🔋 100%</span>
    </div>
  </div>

  <!-- Desktop App Grid -->
  <div id="desktop">
    <div class="app-icon" onclick="openSystemInfo()">
      <div class="app-icon-bg" style="background: #2196F3; color: white;">⚙️</div>
      <span>Settings</span>
    </div>

    <div class="app-icon" onclick="window.location.href='new.html'">
      <div class="app-icon-bg" style="background: #4CAF50; color: white;">🌐</div>
      <span>Browser</span>
    </div>

    <div class="app-icon" onclick="launchV86()">
      <div class="app-icon-bg" style="background: #FF9800; color: white;">🤖</div>
      <span>x86 Engine</span>
    </div>
  </div>

  <!-- Android Navigation Bar (Back, Home, Recents) -->
  <div id="nav-bar">
    <div class="nav-btn" onclick="closeTopWindow()">◁</div>
    <div class="nav-btn" onclick="closeAllWindows()">◯</div>
    <div class="nav-btn" onclick="openSystemInfo()">▢</div>
  </div>

  <script>
    let zIndexCounter = 10;

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function createWindow(title, content) {
      const desktop = document.getElementById('desktop');
      const win = document.createElement('div');
      win.className = 'android-window';
      win.style.zIndex = ++zIndexCounter;

      win.innerHTML = `
        <div class="android-header">
          <span>${title}</span>
          <button class="close-btn" onclick="this.closest('.android-window').remove()">✕</button>
        </div>
        <div class="android-window-body">${content}</div>
      `;

      win.addEventListener('touchstart', () => win.style.zIndex = ++zIndexCounter, {passive: true});
      win.addEventListener('mousedown', () => win.style.zIndex = ++zIndexCounter);
      
      makeDraggableMobile(win);
      desktop.appendChild(win);
      return win;
    }

    function openSystemInfo() {
      createWindow('Neature OS (Android 8.0)', `
        <h3 style="color: #3f51b5; margin-bottom: 8px;">Neature OS Oreo</h3>
        <p style="color: #666; font-size: 14px;">Version: 8.0.0 (Oreo Mobile Web)</p>
        <hr style="margin: 12px 0; border: none; border-top: 1px solid #ddd;">
        <p>Touch controls are active. Drag the blue title bar to move windows on your phone screen.</p>
      `);
    }

    function launchV86() {
      const win = createWindow('x86 Emulator Console', `
        <div id="screen_container" style="background:#000; width:100%; height:100%; min-height: 200px;">
          <div style="white-space: pre; font-family: monospace; color: #fff;"></div>
          <canvas style="display: none"></canvas>
        </div>
      `);

      if (typeof V86Starter !== 'undefined') {
        new V86Starter({
          wasm_path: "build/v86.wasm",
          memory_size: 32 * 1024 * 1024,
          vga_bios: { url: "build/vgabios.bin" },
          bios: { url: "build/seabios.bin" },
          screen_container: win.querySelector("#screen_container"),
          autostart: true,
        });
      }
    }

    function closeTopWindow() {
      const windows = document.querySelectorAll('.android-window');
      if (windows.length > 0) windows[windows.length - 1].remove();
    }

    function closeAllWindows() {
      document.querySelectorAll('.android-window').forEach(w => w.remove());
    }

    // --- TOUCH & MOUSE DRAGGING SYSTEM ---
    function makeDraggableMobile(win) {
      const header = win.querySelector('.android-header');
      let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

      // Mobile Touch Handling
      header.addEventListener('touchstart', (e) => {
        if (e.target.classList.contains('close-btn')) return;
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        initialLeft = win.offsetLeft;
        initialTop = win.offsetTop;

        function onTouchMove(e) {
          const touch = e.touches[0];
          const deltaX = touch.clientX - startX;
          const deltaY = touch.clientY - startY;
          win.style.left = (initialLeft + deltaX) + 'px';
          win.style.top = (initialTop + deltaY) + 'px';
        }

        function onTouchEnd() {
          document.removeEventListener('touchmove', onTouchMove);
          document.removeEventListener('touchend', onTouchEnd);
        }

        document.addEventListener('touchmove', onTouchMove, { passive: false });
        document.addEventListener('touchend', onTouchEnd);
      }, { passive: true });

      // Desktop Mouse Handling Fallback
      header.onmousedown = (e) => {
        if (e.target.classList.contains('close-btn')) return;
        let mouseX = e.clientX;
        let mouseY = e.clientY;

        document.onmousemove = (e) => {
          let deltaX = mouseX - e.clientX;
          let deltaY = mouseY - e.clientY;
          mouseX = e.clientX;
          mouseY = e.clientY;
          win.style.top = (win.offsetTop - deltaY) + "px";
          win.style.left = (win.offsetLeft - deltaX) + "px";
        };

        document.onmouseup = () => {
          document.onmousemove = null;
          document.onmouseup = null;
        };
      };
    }

    openSystemInfo();
  </script>
</body>
</html>
