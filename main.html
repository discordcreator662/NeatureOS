<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neature OS - Android 8</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Roboto', 'Segoe UI', sans-serif; }
    
    body {
      /* Android 8 Oreo Style Wallpaper */
      background: linear-gradient(135deg, #1a237e 0%, #311b92 50%, #880e4f 100%);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Android Status Bar */
    #status-bar {
      height: 24px;
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      font-size: 12px;
      z-index: 10000;
    }

    .status-left, .status-right {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Desktop Grid Area */
    #desktop {
      flex-grow: 1;
      position: relative;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      grid-template-rows: repeat(auto-fill, minmax(90px, 1fr));
      gap: 15px;
    }

    /* App Icons */
    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      font-size: 12px;
    }

    .app-icon-bg {
      width: 52px;
      height: 52px;
      background: #ffffff;
      border-radius: 50%; /* Android adaptive round icons */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      margin-bottom: 6px;
      transition: transform 0.1s;
    }

    .app-icon:active .app-icon-bg {
      transform: scale(0.92);
    }

    /* Android 8 Window / App Cards */
    .android-window {
      position: absolute;
      width: 420px;
      height: 340px;
      background: #fafafa;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* Android Card Header */
    .android-header {
      height: 48px;
      background: #3f51b5; /* Android Material Blue */
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-weight: 500;
      font-size: 15px;
      cursor: move;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    .android-window-body {
      flex-grow: 1;
      padding: 16px;
      overflow: auto;
      color: #212121;
    }

    /* Android Navigation Bar (Bottom) */
    #nav-bar {
      height: 48px;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 60px;
      z-index: 10000;
    }

    .nav-btn {
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      opacity: 0.85;
      padding: 10px;
    }

    .nav-btn:hover {
      opacity: 1;
    }
  </style>
  <script src="build/libv86.js"></script>
</head>
<body>

  <!-- Android 8 Status Bar -->
  <div id="status-bar">
    <div class="status-left">
      <span id="clock">12:00</span>
    </div>
    <div class="status-right">
      <span>📶</span>
      <span>🔋 100%</span>
    </div>
  </div>

  <!-- Desktop App Grid -->
  <div id="desktop">
    
    <!-- System App Icon -->
    <div class="app-icon" onclick="openSystemInfo()">
      <div class="app-icon-bg" style="background: #2196F3; color: white;">⚙️</div>
      <span>Settings</span>
    </div>

    <!-- Launcher App Icon -->
    <div class="app-icon" onclick="window.location.href='new.html'">
      <div class="app-icon-bg" style="background: #4CAF50; color: white;">🌐</div>
      <span>Browser</span>
    </div>

    <!-- x86 Emulator Icon -->
    <div class="app-icon" onclick="launchV86()">
      <div class="app-icon-bg" style="background: #FF9800; color: white;">🤖</div>
      <span>x86 Engine</span>
    </div>

  </div>

  <!-- Android 8 Navigation Bar (Back, Home, Recents) -->
  <div id="nav-bar">
    <div class="nav-btn" title="Back" onclick="closeTopWindow()">◁</div>
    <div class="nav-btn" title="Home" onclick="closeAllWindows()">◯</div>
    <div class="nav-btn" title="Recents" onclick="openSystemInfo()">▢</div>
  </div>

  <script>
    let zIndexCounter = 10;

    // Clock update
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function createWindow(title, content) {
      const desktop = document.getElementById('desktop');
      const win = document.createElement('div');
      win.className = 'android-window';
      win.style.left = '40px';
      win.style.top = '30px';
      win.style.zIndex = ++zIndexCounter;

      win.innerHTML = `
        <div class="android-header">
          <span>${title}</span>
          <button class="close-btn" onclick="this.closest('.android-window').remove()">✕</button>
        </div>
        <div class="android-window-body">${content}</div>
      `;

      win.addEventListener('mousedown', () => win.style.zIndex = ++zIndexCounter);
      makeDraggable(win);
      desktop.appendChild(win);
      return win;
    }

    function openSystemInfo() {
      createWindow('Neature OS (Android 8.0)', `
        <h3 style="color: #3f51b5; margin-bottom: 8px;">Neature OS Oreo</h3>
        <p style="color: #666; font-size: 14px;">Version: 8.0.0 (Oreo Web Edition)</p>
        <hr style="margin: 12px 0; border: none; border-top: 1px solid #ddd;">
        <p>System memory configured and running web modules active.</p>
      `);
    }

    function launchV86() {
      const win = createWindow('x86 Emulator Console', `
        <div id="screen_container" style="background:#000; width:100%; height:100%; min-height: 200px;">
          <div style="white-space: pre; font-family: monospace; color: #fff;"></div>
          <canvas style="display: none"></canvas>
        </div>
      `);

      if (typeof V86Starter !== 'undefined') {
        new V86Starter({
          wasm_path: "build/v86.wasm",
          memory_size: 32 * 1024 * 1024,
          vga_bios: { url: "build/vgabios.bin" },
          bios: { url: "build/seabios.bin" },
          screen_container: win.querySelector("#screen_container"),
          autostart: true,
        });
      }
    }

    function closeTopWindow() {
      const windows = document.querySelectorAll('.android-window');
      if (windows.length > 0) windows[windows.length - 1].remove();
    }

    function closeAllWindows() {
      document.querySelectorAll('.android-window').forEach(w => w.remove());
    }

    function makeDraggable(win) {
      const header = win.querySelector('.android-header');
      let x = 0, y = 0, mouseX = 0, mouseY = 0;
      header.onmousedown = (e) => {
        if (e.target.classList.contains('close-btn')) return;
        mouseX = e.clientX;
        mouseY = e.clientY;
        document.onmousemove = (e) => {
          x = mouseX - e.clientX;
          y = mouseY - e.clientY;
          mouseX = e.clientX;
          mouseY = e.clientY;
          win.style.top = (win.offsetTop - y) + "px";
          win.style.left = (win.offsetLeft - x) + "px";
        };
        document.onmouseup = () => {
          document.onmousemove = null;
          document.onmouseup = null;
        };
      };
    }

    openSystemInfo();
  </script>
</body>
</html>
