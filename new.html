<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neature OS - New Window</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      font-family: "Geneva", "Chicago", "Courier New", sans-serif;
      background-color: #777;
      background-image: radial-gradient(#000 15%, transparent 16%);
      background-size: 4px 4px;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mac-dialog {
      width: 380px;
      background: #fff;
      border: 2px solid #000;
      box-shadow: 4px 4px 0px #000;
      padding: 12px;
    }

    .mac-titlebar {
      height: 18px;
      background: repeating-linear-gradient(0deg, #fff, #fff 1px, #000 1px, #000 2px);
      border-bottom: 2px solid #000;
      margin: -12px -12px 12px -12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
    }

    .title-text {
      background: #fff;
      padding: 0 6px;
    }

    p { font-size: 13px; margin-bottom: 12px; }

    input {
      width: 100%;
      padding: 4px;
      border: 2px solid #000;
      font-family: inherit;
      margin-bottom: 12px;
      outline: none;
    }

    .btn-group {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    button {
      background: #fff;
      border: 2px solid #000;
      padding: 4px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000;
    }

    button:active {
      background: #000;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="mac-dialog">
    <div class="mac-titlebar">
      <span class="title-text">Neature OS - Launch Window</span>
    </div>
    
    <p>Enter a website URL to open in a Neature OS virtual window:</p>
    <input type="text" id="target-url" value="https://wikipedia.org">

    <div class="btn-group">
      <button onclick="window.location.href='main.html'">Cancel</button>
      <button onclick="launchTarget()">Launch Window</button>
    </div>
  </div>

  <script>
    function launchTarget() {
      const url = document.getElementById('target-url').value;
      window.location.href = `main.html?launch=${encodeURIComponent(url)}`;
    }
  </script>
</body>
</html>
