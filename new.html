<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neature OS - Launch Window</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', 'Segoe UI', sans-serif; }
    
    body {
      background: linear-gradient(135deg, #1a237e 0%, #311b92 50%, #880e4f 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* Android Material Dialog Card */
    .material-dialog {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .dialog-header {
      background: #3f51b5;
      color: #ffffff;
      padding: 18px 20px;
      font-size: 18px;
      font-weight: 500;
    }

    .dialog-body {
      padding: 20px;
      color: #333;
    }

    .dialog-body p {
      font-size: 14px;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    /* Material Outlined Input */
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #3f51b5;
      border-width: 2px;
    }

    /* Material Action Buttons */
    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 12px 20px 16px 20px;
    }

    button {
      background: transparent;
      border: none;
      color: #3f51b5;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s;
    }

    button:hover {
      background: rgba(63, 81, 181, 0.08);
    }

    button.btn-primary {
      background: #3f51b5;
      color: #ffffff;
    }

    button.btn-primary:hover {
      background: #303f9f;
    }
  </style>
</head>
<body>

  <div class="material-dialog">
    <div class="dialog-header">
      Launch Web App
    </div>
    
    <div class="dialog-body">
      <p>Enter a web URL to open inside a Neature OS Oreo window:</p>
      <input type="text" id="target-url" value="https://wikipedia.org">
    </div>

    <div class="dialog-actions">
      <button onclick="window.location.href='main.html'">Cancel</button>
      <button class="btn-primary" onclick="launchTarget()">Launch</button>
    </div>
  </div>

  <script>
    function launchTarget() {
      const url = document.getElementById('target-url').value;
      window.location.href = `main.html?launch=${encodeURIComponent(url)}`;
    }
  </script>
</body>
</html>
